<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Player je u layoutu, dakle na svakoj stranici, i odmah po montiranju
         traži nowplaying s ovog hosta — otvori vezu prije nego zatreba. -->
    <link rel="preconnect" href="https://radio.radio-roza.org" crossorigin />

    <!-- The above-the-fold fonts: Syne for titles, PT Mono for meta text.
         latin-ext is preloaded too — Croatian diacritics appear on every page
         (the "Radio Roža" header alone needs it). -->
    <link
      rel="preload"
      href="/fonts/syne/webfonts/syne-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/syne/webfonts/syne-latin-ext-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/PT_Mono/PTMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Čitaj radio — Radio Roža"
      href="/citaj-radio/rss.xml"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e20000" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
